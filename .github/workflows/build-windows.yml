name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download official sing-box for Windows x64
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/SagerNet/sing-box/releases/latest" -Headers @{ "User-Agent" = "PristalVPN-build" }
          $asset = $release.assets | Where-Object { $_.name -match '^sing-box-.*-windows-amd64\.zip$' } | Select-Object -First 1
          if (-not $asset) {
            throw "Could not find the official Windows AMD64 sing-box archive in the latest stable release."
          }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile sing-box.zip
          Expand-Archive -Path sing-box.zip -DestinationPath sing-box-unpacked -Force
          $core = Get-ChildItem -Path sing-box-unpacked -Filter sing-box.exe -Recurse | Select-Object -First 1
          if (-not $core) {
            throw "sing-box.exe was not found in the downloaded archive."
          }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item $core.FullName dist/sing-box.exe
          Write-Host "Bundled sing-box version: $($release.tag_name)"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --windowed --name PristalVPN PristalVPN.py

      - name: Upload complete Windows package
        uses: actions/upload-artifact@v4
        with:
          name: PristalVPN-Windows-x64
          path: |
            dist/PristalVPN.exe
            dist/sing-box.exe
          if-no-files-found: error
